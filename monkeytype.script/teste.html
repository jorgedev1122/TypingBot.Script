<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Typing Bot Test</title>

    <style>
      body {
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 80px auto;
        padding: 20px;
      }

      #texto {
        background: #222;
        padding: 20px;
        border-radius: 10px;
        line-height: 1.8;
        margin-bottom: 20px;
      }

      textarea {
        width: 100%;
        height: 150px;
        box-sizing: border-box;
        background: #181818;
        color: white;
        border: 2px solid #444;
        border-radius: 10px;
        padding: 15px;
        font-size: 18px;
      }

      #resultado {
        margin-top: 20px;
        font-size: 22px;
      }
    </style>
  </head>

  <body>
    <h1>Typing Bot Test</h1>

    <div id="texto">Aguardando frase...</div>

    <textarea id="entrada" autofocus></textarea>

    <div id="resultado">Aguardando...</div>
  </body>
</html>
